<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra MAX · Avatar Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080810; --surface: #0d0d1a; --card: #12121f; --card-h: #161628;
      --border: #1e1e36; --violet: #7B2FFF; --violet2: #9B5FFF;
      --coral: #FF3D5A; --text: #e8e8f0; --muted: #8888aa; --faint: #44445a; --ok: #34d399;
    }
    html, body { min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 14px; overflow-x: hidden; }
    nav { display:flex; align-items:center; justify-content:space-between;
      padding:16px 24px; border-bottom:1px solid var(--border);
      position:sticky; top:0; background:rgba(8,8,16,.92);
      backdrop-filter:blur(12px); z-index:20; }
    .nav-logo { font-family:'Bebas Neue',sans-serif; font-size:22px;
      letter-spacing:.08em; color:var(--text); text-decoration:none; }
    .nav-logo span { color:var(--violet2); }
    .nav-back { font-size:12px; color:var(--muted); text-decoration:none; }
    .nav-back:hover { color:var(--text); }
    header { padding:40px 24px 0; max-width:1100px; margin:0 auto; }
    .eyebrow { font-size:11px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--violet2); margin-bottom:10px; }
    h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(32px,6vw,52px);
      letter-spacing:.04em; margin-bottom:8px; }
    .sub { color:var(--muted); font-size:13px; max-width:480px; line-height:1.6; margin-bottom:4px; }
    .tabs-wrap { position:sticky; top:57px; z-index:10; padding:14px 24px 10px;
      background:linear-gradient(var(--bg) 80%,transparent);
      max-width:1100px; margin:0 auto; }
    .tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .tab { background:var(--card); border:1px solid var(--border);
      color:var(--muted); font-size:12px; font-weight:500;
      padding:6px 14px; border-radius:20px; cursor:pointer;
      transition:all .15s; white-space:nowrap; }
    .tab:hover { border-color:var(--violet2); color:var(--violet2); }
    .tab.active { background:var(--violet); border-color:var(--violet); color:#fff; }
    .search-wrap { max-width:1100px; margin:0 auto; padding:10px 24px 4px; }
    .search-wrap input { width:100%; max-width:300px; background:var(--card);
      border:1px solid var(--border); color:var(--text); font-family:'Inter',sans-serif;
      font-size:13px; padding:8px 14px; border-radius:8px; outline:none; transition:border-color .15s; }
    .search-wrap input:focus { border-color:var(--violet); }
    .search-wrap input::placeholder { color:var(--faint); }
    .grid-wrap { max-width:1100px; margin:0 auto; padding:16px 24px 80px; }
    .count { font-size:11px; color:var(--muted); margin-bottom:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:12px; }
    .av { background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:10px 8px 8px; text-align:center;
      cursor:pointer; transition:border-color .15s,background .15s,transform .1s;
      position:relative; overflow:hidden; }
    .av:hover { border-color:var(--violet2); background:var(--card-h); transform:translateY(-2px); }
    .av.copied { border-color:var(--ok); }
    .av img { width:64px; height:64px; border-radius:50%;
      border:2px solid var(--border); background:var(--surface);
      display:block; margin:0 auto 7px; object-fit:cover;
      transition:border-color .15s; }
    .av:hover img { border-color:var(--violet2); }
    .av.copied img { border-color:var(--ok); }
    .av-name { font-size:10px; color:var(--muted); white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    .av-badge { position:absolute; inset:0; display:flex; align-items:center;
      justify-content:center; background:rgba(8,8,16,.75); border-radius:14px;
      font-size:11px; font-weight:600; color:var(--ok); opacity:0;
      transition:opacity .15s; pointer-events:none; }
    .av.copied .av-badge { opacity:1; }
    #toast { position:fixed; bottom:24px; left:50%;
      transform:translateX(-50%) translateY(20px);
      background:var(--ok); color:#000; font-size:12px; font-weight:600;
      padding:8px 20px; border-radius:20px; opacity:0;
      transition:all .2s; pointer-events:none; z-index:99; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    @media(max-width:480px) {
      header,.tabs-wrap,.grid-wrap,.search-wrap { padding-left:16px; padding-right:16px; }
      .grid { grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:10px; }
    }
  </style>

const CATS = [
  {id:"all",label:"All ✦"},
  {id:"disney",label:"🏰 Disney"},
  {id:"marvel",label:"⚡ Marvel"},
  {id:"pixar",label:"🎬 Pixar"},
  {id:"starwars",label:"⭐ Star Wars"},

  {id:"muppets",label:"🐸 Muppets"},
  {id:"simpsons",label:"🍩 Simpsons"},
  {id:"natgeo",label:"🌿 NatGeo"},
  {id:"other",label:"🎭 Other"},
];

let activeTab = "all", searchQ = "";

function getVisible() {
  return AVATARS.filter(([slug,name,cat]) => {
    const tabOk = activeTab === "all" || cat === activeTab;
    const q = searchQ.toLowerCase();
    const searchOk = !q || name.toLowerCase().includes(q) || cat.includes(q);
    return tabOk && searchOk;
  });
}

function render() {
  const visible = getVisible();
  document.getElementById("count").textContent = visible.length + " avatars";
  document.getElementById("grid").innerHTML = visible.map(([slug,name,cat]) => {
    const url = `${BASE}/${slug}.webp`;
    return `<div class="av" onclick="copy('${url}',this)">
      <img src="${url}" alt="${name}" loading="lazy" onerror="this.style.opacity='.15'">
      <div class="av-name">${name}</div>
      <div class="av-badge">Copied ✓</div>
    </div>`;
  }).join("");
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = CATS.map(c =>
    `<button class="tab${c.id===activeTab?" active":""}" onclick="setTab('${c.id}')">${c.label}</button>`
  ).join("");
}

function setTab(id) { activeTab=id; renderTabs(); render(); }

let toastTimer;
function copy(url, card) {
  navigator.clipboard.writeText(url).catch(()=>{
    const t=document.createElement("textarea"); t.value=url;
    t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select();
    document.execCommand("copy"); document.body.removeChild(t);
  });
  document.querySelectorAll(".av.copied").forEach(c=>c.classList.remove("copied"));
  card.classList.add("copied");
  setTimeout(()=>card.classList.remove("copied"),1800);
  const toast=document.getElementById("toast");
  toast.classList.add("show"); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),2000);
}

document.getElementById("searchQ").addEventListener("input",e=>{searchQ=e.target.value;render();});
renderTabs(); render();
