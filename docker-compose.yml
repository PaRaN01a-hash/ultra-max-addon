services:
  ultramax-landing:
    image: nginx:alpine
    container_name: ultramax-landing
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - npm_default

networks:
  npm_default:
    external: true
