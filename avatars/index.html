<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultra MAX Vault</title>
  <style>
    :root {
      --bg: #080810;
      --card: #12121f;
      --violet: #7B2FFF;
      --white: #ffffff;
    }
    body { background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; padding: 40px 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px; max-width: 1000px; margin: 0 auto; }
    .avatar-card { background: var(--card); border: 1px solid #1e1e36; border-radius: 12px; padding: 10px; text-align: center; }
    .avatar-img { width: 100%; border-radius: 50%; aspect-ratio: 1/1; object-fit: cover; border: 2px solid var(--violet); }
  </style>
</head>
<body>
  <div class="grid">
  </div></body></html>
